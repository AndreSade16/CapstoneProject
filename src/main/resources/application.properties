spring.application.name=capstone
spring.config.import=file:env.properties
#SERVER CONFIG
server.port=${PORT}
#DB CONFIG
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PW}
spring.datasource.driver=org.postgresql.Driver
#HIBERNATE
spring.jpa.hibernate.ddl-auto=update
#JWT
jwt.secret=${JWT_SECRET}
#CLOUDINARY
cloudinary.apikey=${CLOUDINARY_API_KEY}
cloudinary.username=${CLOUDINARY_USERNAME}
cloudinary.secret=${CLOUDINARY_SECRET}
#MAILGUN
mailgun.domainName=${MAILGUN_DOMAIN_NAME}
mailgun.apiKey=${MAILGUN_API_KEY}

